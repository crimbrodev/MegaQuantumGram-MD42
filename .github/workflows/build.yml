name: Build MegaQuantumGram MD42 APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install SDK 37, Build-Tools 36, NDK 29, CMake 4
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          PLATFORM_PKG=$(sdkmanager --list | grep -oE "platforms;android-37(\.[0-9]+)?" | head -n 1)
          PLATFORM_PKG=${PLATFORM_PKG:-platforms;android-37}
          CMAKE_PKG=$(sdkmanager --list | grep -oE "cmake;4\.[0-9]+\.[0-9]+" | sort -V | tail -n 1)
          echo "Installing: $PLATFORM_PKG and $CMAKE_PKG"
          sdkmanager "build-tools;36.0.0" "ndk;29.0.14206865" "$PLATFORM_PKG" "$CMAKE_PKG"

      - name: Create API_KEYS and signing keystore
        env:
          RAW_APP_ID: ${{ secrets.APP_ID }}
          RAW_APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          APP_HASH_CLEAN="${RAW_APP_HASH//\"/}"
          printf "APP_ID = %s\nAPP_HASH = \"%s\"\nMAPS_V2_API = dummy_maps_key\nSIGNING_KEY_PASSWORD = sloppassword\nSIGNING_KEY_ALIAS = slopalias\nSIGNING_KEY_STORE_PASSWORD = sloppassword\n" "$RAW_APP_ID" "$APP_HASH_CLEAN" > API_KEYS
          mkdir -p TMessagesProj/config
          keytool -genkeypair -v -keystore TMessagesProj/config/exteraGram.jks -alias slopalias -keyalg RSA -keysize 2048 -validity 10000 -storepass sloppassword -keypass sloppassword -dname "CN=MegaQuantumGram, OU=MD42, O=SlopGram, L=Net, ST=Web, C=RU"

      - name: Build Full Arm64 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf "github.token=%s\n" "$GITHUB_TOKEN" >> local.properties
          chmod +x gradlew
          python3.11 --version
          ./gradlew :TMessagesProj:assembleFullArm64Debug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaQuantumGram-MD42-apk
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
